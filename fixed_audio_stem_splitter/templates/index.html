<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audio Stem Splitter</title><link rel="stylesheet" href="/static/style.css"></head><body>
<div class="wrap"><header><h1>🎵 Audio Stem Splitter</h1><p>MP3/WAV hochladen → Stimme, Drums, Bass und Melodie getrennen → schneiden → downloaden.</p></header>
<section id="drop" class="drop"><input id="file" type="file" accept="audio/*"><div class="big">Datei hierher ziehen</div><button onclick="document.getElementById('file').click()">Audio auswählen</button><span id="name"></span></section>
<section id="progress" class="hidden"><div class="bar"><i id="bar"></i></div><p id="status">Analyse läuft …</p></section>
<section id="editor" class="hidden"><div class="toolbar"><button id="playAll">▶ Alle</button><button id="stop">■ Stop</button><span id="time">00:00.000</span></div><div id="tracks"></div></section>
</div><script src="/static/app.js"></script></body></html>
